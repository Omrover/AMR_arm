# IK del brazo de 4 GDL con pick_ik. Con 4 GDL solo son alcanzables las
# orientaciones con el eje de aproximación en el plano vertical que pasa por la
# junta 1 (yaw = atan2(y, x)) y roll fijo: una meta 6D arbitraria no tiene
# solución exacta. rotation_scale < 1 prioriza la posición; en RViz activar
# "Approx IK Solutions" para arrastrar el marcador libremente.
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
