# Servidor del brazo. Límites y nombres de juntas: amr_mqtt_bridge/config/arm.yaml
# (se cargan juntos en arm_server.launch.py).
arm_server:
  ros__parameters:
    base_frame: arm_base_link
    tray_frame: tray_link
    max_accel: 1.5            # rad/s^2 con velocity_scale = 1
    joint_tolerance: 0.02     # rad
    # Poses tentativas: todos los eslabones fuera del plano del LiDAR. Ajustar
    # con la geometría real (CAD) y probar con el brazo en el aire.
    pose_names: [rest, stow, dock_view, scan, tray_above]
    poses:
      # rest: el brazo sentado en su tope (pose de calibración, arm_ref_pose en
      # arm.yaml). q2 = -0.05 queda 0.009 rad arriba de la referencia: ahí el link 2
      # asienta sin que el motor empuje contra el tope. Estacionar aquí antes de apagar.
      rest: [3.14159, -0.05, 0.058, 0.0]
      stow: [0.0, 0.865, -0.651, 1.357]
      # dock_view: cámara a 0.50 m del suelo mirando al frente con pitch -5°, todo el
      # brazo detrás de x = 0.20 m (eslabón 2 en su tope, codo abierto 0.15). Sin
      # autocolisión con las mallas del CAD con margen de +-0.03 rad.
      dock_view: [3.14159, -0.05, -0.15, 0.35]
      scan: [3.14159, 1.469, -0.965, 0.295]
      # tray_above: TCP horizontal detrás del brazo a 0.60 m del piso. Con el gripper
      # siempre horizontal la bandeja tiene que ir elevada (~0.55-0.6 m, reach_map).
      tray_above: [0.0, 1.149, -0.211, -0.938]
    # Agarre con el gripper siempre horizontal: pregrasp approach_distance antes de la
    # pieza (sobre la radial desde la base del brazo), avance recto, cerrar, subir
    # lift_height. Al dejar: arriba, bajar, soltar, retirarse approach_distance.
    grasp_pitch: 0.0          # rad respecto a la horizontal
    approach_distance: 0.08   # m
    lift_height: 0.12
    place_clearance: 0.01
    gripper_open: 0.0
    gripper_close: 1.0
    gripper_max_current: 1.0  # A medidos con el ACS712
    gripper_timeout: 3.0
    # require_grasp lo pone el launch (true por defecto; sim: false porque gz_mcu no
    # detecta la pieza). Si estuviera aquí, con el nombre del nodo, ganaría al launch.
