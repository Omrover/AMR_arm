# Servidor del brazo. Límites y nombres de juntas: amr_mqtt_bridge/config/arm.yaml
# (se cargan juntos en arm_server.launch.py).
arm_server:
  ros__parameters:
    base_frame: arm_base_link
    tray_frame: tray_link
    max_accel: 1.5            # rad/s^2 con velocity_scale = 1
    joint_tolerance: 0.02     # rad
    # Poses tentativas: todos los eslabones fuera del plano del LiDAR. Ajustar
    # con la geometría real (CAD) y probar con el brazo en el aire.
    pose_names: [stow, dock_view, scan, tray_above]
    poses:
      stow: [0.0, 0.865, -0.651, 1.357]
      dock_view: [0.0, 1.25, 0.1, 1.7]
      scan: [3.14159, 1.469, -0.965, 0.295]
      tray_above: [3.14159, 1.487, 1.14, -1.055]
    pregrasp_height: 0.08     # m sobre la pieza
    lift_height: 0.12
    place_clearance: 0.01
    gripper_open: 0.0
    gripper_close: 1.0
    gripper_max_current: 1.0  # A medidos con el ACS712
    gripper_timeout: 3.0
    # require_grasp lo pone el launch (true por defecto; sim: false porque gz_mcu no
    # detecta la pieza). Si estuviera aquí, con el nombre del nodo, ganaría al launch.
